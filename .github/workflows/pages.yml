name: GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'studio/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'studio/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check types
        run: npx tsc --noEmit
      - name: Verify read-only portfolio integration
        run: node scripts/check-portfolio.mjs
      - name: Set up Java for the local Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Firestore authorization and source links
        run: npm run test:firestore
      - name: Build public catalog
        run: npm run build:pages
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Verify Pages artifact
        run: node scripts/check-pages.mjs
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: studio/dist-pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
